<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geliştiriciler için HTML çapa (anchor)
    sisteminin kod örnekleri ve detayları.">
    <title>Teknik Blog | Anchor Sistemi</title>
</head>
<body>
    <h1 id="sayfa-basi">
        Sayfa İçi Çapa (Anchor) Sistemi
    </h1>
    <p>
        HTML'de sayfa içi geçişler yapmak için <code>href="#id"</code> mantığı kullanılır.
    </p>

    <br><br><br><br>

    <h2 id="Kod Örneği">
        Kod Örneği
    </h2>
    <p>
        <code>
        &lt; a href="#sayfa"&gt;Tıkla&lt;/a&gt;
    </code>
    </p>
    
</body>
</html>
