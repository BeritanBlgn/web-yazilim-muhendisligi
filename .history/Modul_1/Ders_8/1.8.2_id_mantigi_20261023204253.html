<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders-8 / ID Mantığı</title>
</head>
<body>
    <!-- ID açılımı= identification anlamı= Kimlik -->
     <h1>
        Kimlik Verme ID Mantığı
        HTML etiketlerine hedefleme ve sayfa içi gezinme için benzersiz (unique(eşsiz)) kimlik (id) atama kuralları:
     </h1>
     <!-- Başlıklara benzersiz kimlikler atandı -->
     <h2 id="hakkimizda">
        Hakkımızda Bölümü
     </h2>
     <p>
        Şirketimizin vizyon ve misyon yazıları burada yer alacak.
     </p>
     <h2 id="hizmetler">
        Hizmetlerimiz
     </h2>
     <p>
        Web tasarım ve danışmanlık hzimetlerimiz.
     </p>
</body>
</html>
