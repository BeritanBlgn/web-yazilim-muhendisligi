<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders-7/Performans</title>
</head>
<body>
    <h1>
        Vektörel Grafikler ve İkonlar
    </h1>
    <h2>
        Matematiksel Bir Çember (SVG)
    </h2>
    <!-- Şeklinde harici dosya yerine doğrudan koordinatlarla
     çizdiriyoruz -->
     <svg width="100" height="100">
        <circle cx="50" cy="50" r="40" fill="orange"/>
     </svg>
     <!-- cx ve cy: Merkez Koordinatları (Center X, Y): Çemberin merkez noktasını belirleyen X ve Y ekseni değerleridir.
      r="": Yarıçap (Radius): Çemberin piksel cinsinden büyüklüğünü belirler.
      fill:"":Dolgu Rengi: Şeklin iç dolgu rengini tanımlar (CSS ile de kontrol edilebilir)
      .
       -->
</body>
</html>
