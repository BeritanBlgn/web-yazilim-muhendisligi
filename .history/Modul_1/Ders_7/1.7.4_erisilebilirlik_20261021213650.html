<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders-7/Erişilebilirlik</title>
</head>
<body>
    <h1>
        Erişilebilirlik
    </h1>
    <!-- resmin açıklaması güzel ve açıklayızı olmalı
     bunun yapılma sebebi erişilebilirlik -->
    <img src="logo-1.png" 
    title=""
    alt="Dağların arasındaki nehrin kenarlarında
    kırmızı boyalı evlerin olduğu güzel bir manzara">
    <h2>
        Başarılı Yükleme (Görünmek Alt Metni)
    </h2>
    <img src="logo-1.png" alt="Leader Coders
    Şirket Logosu" width="150">
    <h2>
        Hatalı Yükleme (Görünen Alt Metni)
        <!-- A11y erişilebilirlik demektir. açılımı: Accessibility -->
    </h2>
    <img src="images/olmayan_resim.jpg" 
    alt="Güneşli bir orman manzarası" width="300">
    <!-- dekoratif amaçlı resimlerde alt etiketine açıklama eklenmek zorunda değil
     ama öenmli resimlerde eklenmek zorunda -->
</body>
</html>
