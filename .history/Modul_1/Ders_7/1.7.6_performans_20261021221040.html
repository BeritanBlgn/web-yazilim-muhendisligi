      jpeg özelliği manzara resimlerinde kullaılması ama transparanlık, hareketlilik yokutr

      gif animasyon ve hareketlilik var transparan olaraak kullanıldığında da kenarları tırtıklı gösterir

      ama webP formatı en iyi formattır
      ama baskı için kullanılacaksa png gibi formatlar daha yatkındır -->
      <!--
