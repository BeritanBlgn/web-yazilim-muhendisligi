<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders-9 | Medya</title>
</head>
<body>
    <h1>
        Video ve Ses Oynatıcıları
    </h1>
    <h2>
        Podcast Oynatıcısı
    </h2>
    <audio src="muzik.mp3" controls>
        <!-- controls parametresi kullanılmak zorunda 
         kullanılmazsa eğer ses video oynatılmaz. başlat durdur 
         düğmeleri görünmez -->

    </audio>
    <h2>
        Tanıtım Videosu
    </h2>
    <video src="ornek.mp4" width="500" controls autoplay muted>
        <!-- aoutoplay tek başına kullanılamaz muted parametresi ile 
         kullanılmak zorunda.
         loop parametresi: sonsuz döngü demektir. video, ses bitince otomatik olarak 
         tekrar başlatır. -->
        Tarayıcınız video oynatıcıyı desteklemiyor.
    </video>
</body>
</html>
