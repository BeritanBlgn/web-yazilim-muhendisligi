<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders-9 | Site ve Harita Gömmek (İframe)</title>
</head>

<body>
    <h1>
        Site ve Harita Gömmek (İframe)
    </h1>
    <h2>
        Youtube videosu gömme
    </h2>
    <!-- kodunu youtube'tan alırız. video altında paylaş butonuna tıklarız
     <> butonuna tıklayıp çıkan kodu iframe kodundan itibaren kopyalayıp direkt buraya yapıştrırız. -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/mX9L_JkAwTQ?si=dIi6J57AEBBFD_LI"
        title="YouTube video player" frameborder="0" allow="
    accelerometer; 
    autoplay; 
    clipboard-write; 
    encrypted-media; 
    gyroscope; 
    picture-in-picture; 
    web-share
    " referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <!-- Youtube'dan kopyalanan kod -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/jNQXAC9IVRw" title="=Youtube video player"
        frameborder="0" allowfullscreen></iframe>

    <h2>
        Ofis Konumumuz
    </h2>
    <!-- Google Maps'ten kopyalanan kod -->
    <iframe src="https://www.google.com/maps/embed?pb=..." width="600" height="450" style="border:0;"
        loading="lazy"></iframe>
    <!-- iframe: dışarıdaki manzarayı içeriye taşıma
       embed: iframe ile alınan kodları gömer. örnek: youtube, google maps... -->
    <h2>
        google haritası gömme
    </h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d206088.19658655123!2d43.8706398010254!3d36.187766998937704!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x400722fe13443461%3A0x3e01d63391de79d1!2sErbil%2C%20Irak!5e0!3m2!1str!2str!4v1793126478618!5m2!1str!2str"
        width="600" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
        <!-- border çizgi demek -->
    </iframe>
</body>

</html>
