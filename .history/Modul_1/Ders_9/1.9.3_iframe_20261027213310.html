<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders-9 | Site ve Harita Gömmek (İframe)</title>
</head>
<body>
    <h1>
        Site ve Harita Gömmek (İframe) 
    </h1>
    <h2>
     youtube videosu gömme
    </h2>
    <!-- kodunu youtube'tan alırız. video altında paylaş butonuna tıklarız
     > -->
    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/mX9L_JkAwTQ?si=dIi6J57AEBBFD_LI" 
    title="YouTube video player" frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; 
    encrypted-media; gyroscope; picture-in-picture; 
    web-share" referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen></iframe>
    <!-- Youtube'dan kopyalanan kod -->
     <iframe width="560" height="315"
     src="https://www.youtube.com/embed/jNQXAC9IVRw"
     title="=Youtube video player" frameborder="0"
     allowfullscreen></iframe>

     <h2>
        Ofis Konumumuz
     </h2>
     <!-- Google Maps'ten kopyalanan kod -->
      <iframe src="https://www.google.com/maps/embed?pb=..."
      width="600" height="450"
      style="border:0;" loading="lazy"></iframe>
      <!-- iframe: dışarıdaki manzarayı içeriye taşıma
       embed: iframe ile alınan kodları gömer. örnek: youtube, google maps... -->
    </body>
</html>
